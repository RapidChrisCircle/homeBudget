# This file is a TEMPLATE (see frontend/Dockerfile: copied to
# /etc/nginx/templates/default.conf.template, not conf.d/ directly) - the
# base nginx image's own entrypoint runs envsubst over it at container
# start, substituting ${API_UPSTREAM} below from this container's own
# environment (docker-compose.qnap.yml's API_UPSTREAM, defaulting to
# `homebudget-api:8000` - the api service's own PINNED container_name, not
# its service name `api` - see that file's header comment for the full
# reasoning) before nginx ever reads the result. This is an escape hatch:
# if that name ever doesn't resolve from the web container on some
# deployment, pointing nginx elsewhere is a one-field change in Container
# Station (README.md's "502 Bad Gateway" troubleshooting section covers
# how to find a value that does) rather than a new image.
#
# 127.0.0.11 is Docker's embedded DNS server, reachable from every
# container on a Docker-managed network. Declaring it here (rather than
# writing `proxy_pass http://${API_UPSTREAM};` directly) is what makes
# nginx re-resolve the upstream on every request instead of once at
# startup and caching it for the worker process's lifetime.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # A variable, not a literal in proxy_pass, is what forces nginx to
        # resolve through the resolver directive above per-request rather
        # than at config load - a literal target that can't be resolved
        # yet would make nginx refuse to start entirely, whereas an
        # unresolvable variable target instead 502s the individual request
        # and logs why, which is what lets this container start up even a
        # moment before the api container is reachable, and keeps failing
        # legibly rather than crash-looping if API_UPSTREAM is ever wrong
        # for this deployment (docker-compose.qnap.yml's own header
        # comment covers why that can happen and how to fix it).
        set $homebudget_api http://${API_UPSTREAM};
        proxy_pass $homebudget_api$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # nginx's own upstream failures (can't resolve, connection
        # refused, timed out) - NOT a 502/504 the API itself returned;
        # proxy_intercept_errors stays at its default `off`, so those pass
        # straight through untouched. A bare "502 Bad Gateway" says the
        # gateway failed and nothing else; naming the configured upstream
        # turns "every page is broken" into an actionable message on the
        # very page the user is already looking at, since the frontend
        # already renders a JSON body's `detail` field
        # (services/api.ts) the same as any other API error.
        error_page 502 504 = @api_unreachable;
    }

    location @api_unreachable {
        default_type application/json;
        return 502 '{"detail":"Could not reach the API at ${API_UPSTREAM} - check that it is running and that this address resolves from the web container (see the README troubleshooting section on 502 Bad Gateway)."}';
    }

    location / {
        try_files $uri /index.html;
    }
}
