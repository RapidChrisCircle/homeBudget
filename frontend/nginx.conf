# 127.0.0.11 is Docker's embedded DNS server, reachable from every
# container on a Docker-managed network. Declaring it here (rather than
# writing `proxy_pass http://homebudget-api:8000;` directly) is what makes
# nginx re-resolve the upstream on every request instead of once at
# startup and caching it for the worker process's lifetime - see
# docker-compose.qnap.yml's own comment on why the service is named
# `homebudget-api` rather than the more generic `api` this stack used
# before: a name collision with another application on the shared network
# is exactly the failure mode a stale cached address would make
# unrecoverable without restarting this container, even after the DNS
# collision itself was fixed.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # A variable, not a literal in proxy_pass, is what forces nginx to
        # resolve through the resolver directive above per-request rather
        # than at config load - a literal target that can't be resolved
        # yet would make nginx refuse to start entirely, whereas an
        # unresolvable variable target instead 502s the individual request
        # and logs why, which is what lets homebudget-web start up even a
        # moment before homebudget-api is reachable, and keeps failing
        # legibly rather than crash-looping if the two are ever
        # mismatched (an old compose file pointing at a renamed image, or
        # vice versa).
        set $homebudget_api http://homebudget-api:8000;
        proxy_pass $homebudget_api$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri /index.html;
    }
}
