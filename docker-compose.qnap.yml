# Deployment stack for QNAP Container Station.
#
# Assumes Postgres already runs as its own Container Station application, on
# its own Docker network. This stack does not create a database - it joins
# that existing network so the api container can reach Postgres by name.
#
# THE ONE RULE THAT MAKES THIS SAFE TO RUN ALONGSIDE OTHER APPS:
# `api` joins the shared `dbnet`, `web` NEVER does.
#
# Docker's embedded DNS is per-network - a container can only resolve names
# of containers on networks IT is attached to. `web` is therefore on this
# project's own default network and nothing else, which means the name
# `api` resolves to exactly one thing: this project's own api container. It
# does not matter how many other applications on the NAS also name a
# service `api` - none of them are on this project's default network, so
# none of them are even visible to resolve.
#
# Attaching `web` to `dbnet` breaks that guarantee, and is the actual cause
# of the intermittent 404s this stack chased through three releases: on the
# shared network EVERY app's api service claims the generic alias `api`
# (a Compose service is always reachable on its own service name, on every
# network it joins), so Docker's DNS returns several addresses and nginx
# round-robins across them - some requests answered by this app's API,
# others by a completely different application, which 404s every path it
# doesn't recognise. The fix was never renaming things (0.21.2's service
# rename, 0.21.3's aliases and 0.21.4's container_name pinning were all
# treating the symptom); it was keeping `web` off the shared network.
#
# One residual, harmless consequence: this app's api service still OFFERS
# the alias `api` on dbnet, since a service name is always an alias and
# cannot be removed without renaming the service. Nothing here resolves
# over dbnet, so it cannot affect this app - but a neighbouring app that
# wrongly resolves `api` while attached to dbnet could reach this API. See
# README.md's "Running several apps from this template on one NAS".
#
# `dbnet` must already exist on the NAS, named exactly that (it is the
# network the existing Postgres application runs on).
#
# When creating the application in Container Station (Create > Application >
# pull from GitHub, pointing at this file), you will be prompted to fill in
# the variables below - Container Station does not read a .env file.
#
# DATABASE_HOST     - container/service name of the existing Postgres container
# DATABASE_PORT     - Postgres port (default 5432)
# DATABASE_NAME     - database name to use/create
# DATABASE_USER     - database user
# DATABASE_PASSWORD - database password
# WEB_PORT          - host port to publish the web UI on (default 8080).
#                      MUST be unique per application on this NAS - every
#                      app cloned from this template defaults to 8080 and
#                      the second one to start simply fails to bind.

networks:
  dbnet:
    external: true

services:
  api:
    image: ghcr.io/${GHCR_OWNER:-rapidchriscircle}/homebudget-api:latest
    restart: unless-stopped
    networks:
      # dbnet to reach Postgres; default to be reachable by `web`. Both are
      # required - on dbnet alone, `web` (which is deliberately not there)
      # could not reach this container by any name at all.
      - dbnet
      - default
    environment:
      DATABASE_HOST: ${DATABASE_HOST:?set DATABASE_HOST to the Postgres container/service name on dbnet}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_NAME: ${DATABASE_NAME:?set DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER:?set DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  web:
    image: ghcr.io/${GHCR_OWNER:-rapidchriscircle}/homebudget-web:latest
    restart: unless-stopped
    networks:
      # This project's own network ONLY. Stated explicitly rather than left
      # implicit because it is load-bearing: adding `dbnet` here is the one
      # edit that would re-expose this app to every other application's
      # `api` on the shared network. See the header comment.
      - default
    depends_on:
      # Startup order only - it does not wait for the API to be ready, and
      # deliberately doesn't need to: nginx resolves and connects to the
      # upstream per request (frontend/nginx.conf), so a `web` that starts
      # first serves 502s for a few seconds and then recovers on its own.
      - api
    ports:
      - "${WEB_PORT:-8080}:80"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
